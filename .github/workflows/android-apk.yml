name: Android APK

# Builds an installable APK on GitHub's servers and publishes it as a release download.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'design/**']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional defaults baked into the APK. Without them the app asks for the server on first launch.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build the web app
        run: |
          npm run typecheck
          npx vite build --mode android

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Prepare release signing (when secrets are configured)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/maada-release.jks
            cat > android/keystore.properties <<PROPS
          storeFile=../maada-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK
        id: apk
        run: |
          mkdir -p out
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/Beeramarlara-Maada.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/Beeramarlara-Maada.apk
          fi
          echo "tag=apk-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Beeramarlara-Maada-apk
          path: out/Beeramarlara-Maada.apk

      - name: Publish as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Beeramarlara Maada app (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.signing.outputs.release != 'true' }}
          files: out/Beeramarlara-Maada.apk
          body: |
            Install on Android: download **Beeramarlara-Maada.apk** below, open it, and allow "Install unknown apps" when asked.
            On first launch the app asks for the server address and access key.
